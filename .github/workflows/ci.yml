name: DevOps Notes CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t notes-backend .

      - name: Build frontend Docker image
        run: docker build -t notes-frontend ./client

      - name: Test Docker Compose build
        run: docker compose build